[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lvsandbox-e2b"
version = "0.1.0"
description = "E2B API-compatible shim over lv-sandbox"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "lv-agent" }]
dependencies = ["lvsandbox>=0.6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/lvsandbox_e2b"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running lv-sandbox server"]
