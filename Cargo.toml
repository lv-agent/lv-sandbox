[workspace]
resolver = "2"
members = [
    "crates/sandbox-landlock",
    "crates/sandbox-seccomp",
    "crates/sandbox-cgroup",
    "crates/sandbox-core",
    "crates/sandbox-server",
    "crates/sandbox-mcp",
    "crates/lv-cli",
    "crates/sandbox-broker",
    "crates/git-remote-fixus",
    "crates/egress-swap-proxy",
    "tests/e2e",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# 内部 crate
sandbox-landlock = { path = "crates/sandbox-landlock" }
sandbox-seccomp = { path = "crates/sandbox-seccomp" }
sandbox-cgroup = { path = "crates/sandbox-cgroup" }
sandbox-core = { path = "crates/sandbox-core" }
sandbox-server = { path = "crates/sandbox-server" }
sandbox-mcp = { path = "crates/sandbox-mcp" }

# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal", "io-util", "net", "io-std"] }
tokio-util = "0.7"
tokio-stream = "0.1"
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["trace", "http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.28"

# Landlock
landlock = "0.4"

# seccomp
libseccomp = "0.3"

# 系统 API
nix = { version = "0.29", features = ["process", "signal", "resource", "fs"] }
libc = "0.2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 正则（输出脱敏 cr-018+#78 / cr-085 M6 search）
regex = "1"

# cr-085 M6: 文件 find(glob 匹配)+ 遍历
globset = "0.4"
walkdir = "2"

# cr-085 M7: 文件 watch(FS 事件 → SSE)
notify = "6"
async-stream = "0.3"

# 并发
dashmap = "5"

# 错误处理
thiserror = "2"
anyhow = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus = "0.13"

# 配置
serde_yaml = "0.9"

# 时间
chrono = "0.4"

# HTTP
axum = { version = "0.8", features = ["json", "ws"] }
reqwest = { version = "0.12", features = ["json"] }

# MCP（Model Context Protocol）
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
schemars = "1"
uuid = { version = "1", features = ["v4"] }

# cr-087: fixus broker bridge 消费侧
logdb-client = { path = "../../logdb/lv-logdb/logdb-client", features = ["broker"] }
logdb-broker-proto = { path = "../../logdb/lv-logdb/logdb-broker-proto" }

# cr-12 G2: egress-swap-proxy (sentinel→real 兑换)。版本对齐 git-remote-fixus(rustls 0.23 + rcgen 0.14 + webpki-roots 1.0)。
# rustls 0.23 的 aws-lc-rs / ring 双 CryptoProvider 必须只选一个,否则见两个 → 运行期 panic。
# 全 workspace 对齐 ring(git-remote-fixus 也是 ring)。tokio-rustls 关 default(默认含 aws_lc_rs)。
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1.0"
rcgen = "0.14"
