[package]
name = "egress-swap-proxy"
description = "cr-12 G2 reference swap-proxy: TLS-terminate jail helper, recognize sentinel, swap for real token, forward to upstream"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { workspace = true }
# tokio-rustls:workspace 已关 default(去 aws_lc_rs),这里补 ring + 基础 feature。
tokio-rustls = { workspace = true, features = ["ring"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
webpki-roots = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# rcgen 仅测试用(在 tests/common 生成自签证 → 经 env 注入 swap-proxy)。
# I-5:不再在 production binary 里(rcgen 原是 regular dep,会让 main.rs 的自签回退编译进 prod)。
rcgen = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lib]
name = "egress_swap_proxy"
path = "src/lib.rs"

[[bin]]
name = "fixus-egress-swap-proxy"
path = "src/main.rs"
